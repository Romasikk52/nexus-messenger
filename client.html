<!-- language: HTML+JS, file: client.html -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#313338">
<title>Nexus</title>
<style>
  :root {
    --bg: #313338; --bg2: #2b2d31; --bg3: #1e1f22; --bg4: #232428;
    --line: #1f2023; --text: #dbdee1; --dim: #949ba4;
    --accent: #5865f2; --accent2: #4752c4;
    --green: #23a55a; --red: #ed4245; --yellow: #f0b232;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
               overflow:hidden; overscroll-behavior:none; font-size:15px; }
  #app { display:none; height:100vh; height:100dvh; }
  #app.on { display:flex; }

  /* серверы */
  #servers { width:72px; background:var(--bg3); display:flex; flex-direction:column;
             align-items:center; padding:12px 0; gap:8px; overflow-y:auto; }
  #servers::-webkit-scrollbar { width:0; }
  .server { width:48px; height:48px; border-radius:50%; background:var(--bg4);
            display:flex; align-items:center; justify-content:center;
            font-weight:800; font-size:18px; color:#fff; cursor:pointer;
            transition:all .15s; position:relative; flex-shrink:0; }
  .server:hover { border-radius:16px; background:var(--accent); }
  .server.add { background:var(--green); font-size:24px; }

  /* каналы */
  #channels { width:240px; background:var(--bg2); display:flex; flex-direction:column;
              border-right:1px solid var(--line); }
  #channels-header { padding:14px 16px; border-bottom:1px solid var(--line);
                     font-weight:700; font-size:15px; display:flex;
                     justify-content:space-between; align-items:center; }
  #channels-header button { background:none; border:none; color:var(--dim);
                            font-size:18px; cursor:pointer; padding:0 4px; }
  #channels-header button:hover { color:var(--text); }
  #channel-list { flex:1; overflow-y:auto; padding:8px; }
  #channel-list::-webkit-scrollbar { width:4px; }
  #channel-list::-webkit-scrollbar-thumb { background:var(--bg3); border-radius:2px; }
  .chan { display:flex; align-items:center; gap:10px; padding:8px 10px;
          border-radius:6px; cursor:pointer; color:var(--dim);
          margin-bottom:2px; transition:all .1s; }
  .chan:hover { background:var(--bg4); color:var(--text); }
  .chan.active { background:var(--bg4); color:#fff; }
  .chan .av { width:32px; height:32px; border-radius:50%;
              background:linear-gradient(135deg,#5865f2,#b14aff);
              display:flex; align-items:center; justify-content:center;
              color:#fff; font-weight:700; font-size:14px; flex-shrink:0;
              position:relative; }
  .chan .av.online::after { content:''; position:absolute; width:10px; height:10px;
                            background:var(--green); border-radius:50%;
                            border:2px solid var(--bg2); right:-2px; bottom:-2px; }
  .chan .nm { font-size:14px; font-weight:500; }
  .chan .sub { font-size:11px; color:var(--dim); margin-top:1px; }
  .section-h { font-size:11px; color:var(--dim); letter-spacing:1px;
               padding:12px 10px 4px; }

  /* чат */
  #chat-panel { flex:1; display:flex; flex-direction:column; background:var(--bg); }
  #chat-header { height:48px; padding:0 16px; display:flex; align-items:center;
                 gap:10px; border-bottom:1px solid var(--line); flex-shrink:0; }
  #chat-header .title { font-weight:700; font-size:15px; }
  #chat-header .status { font-size:12px; color:var(--dim); }
  #chat-header .status.online { color:var(--green); }
  #chat-header .actions { margin-left:auto; display:flex; gap:6px; }
  #chat-header button { background:var(--bg3); border:none; color:var(--text);
                        width:36px; height:36px; border-radius:50%;
                        cursor:pointer; display:flex; align-items:center;
                        justify-content:center; font-size:16px; transition:all .15s; }
  #chat-header button:hover { background:var(--accent); }
  #chat-header button.end { background:var(--red); }

  #messages { flex:1; overflow-y:auto; padding:16px; display:flex;
              flex-direction:column; gap:2px; }
  #messages::-webkit-scrollbar { width:8px; }
  #messages::-webkit-scrollbar-thumb { background:var(--bg3); border-radius:4px; }
  .msg { display:flex; gap:12px; padding:4px 0; }
  .msg .av { width:40px; height:40px; border-radius:50%;
             background:linear-gradient(135deg,#5865f2,#b14aff);
             display:flex; align-items:center; justify-content:center;
             color:#fff; font-weight:700; flex-shrink:0; }
  .msg .body { flex:1; min-width:0; }
  .msg .head { display:flex; align-items:baseline; gap:8px; }
  .msg .name { font-weight:600; color:#fff; font-size:14px; }
  .msg .time { font-size:11px; color:var(--dim); }
  .msg .txt { color:var(--text); font-size:14.5px; line-height:1.5;
              word-break:break-word; white-space:pre-wrap; }
  .msg.own .name { color:var(--accent); }
  .msg .file { margin-top:6px; background:var(--bg3); border-radius:8px;
               padding:10px 14px; display:inline-flex; gap:10px;
               align-items:center; color:var(--accent); text-decoration:none; font-size:13px; }

  #input-row { padding:0 16px 24px; display:flex; gap:8px; flex-shrink:0; }
  #input-wrap { flex:1; background:var(--bg4); border-radius:8px;
                display:flex; align-items:center; padding:0 12px;
                min-height:44px; max-height:200px; }
  #input { flex:1; background:transparent; border:none; outline:none;
           color:var(--text); font-family:inherit; font-size:15px;
           resize:none; padding:11px 0; max-height:180px; }
  #input::placeholder { color:var(--dim); }
  #input-row .icon { background:var(--accent); border:none; color:#fff;
                     width:44px; height:44px; border-radius:8px; cursor:pointer;
                     display:flex; align-items:center; justify-content:center;
                     font-size:18px; flex-shrink:0; }
  #input-row .icon.file { background:var(--bg4); }

  /* звонок */
  #call-overlay { position:fixed; inset:0; z-index:500; background:#000;
                  display:none; flex-direction:column; align-items:center;
                  justify-content:center; gap:20px; color:#fff; }
  #call-overlay.show { display:flex; }
  #call-overlay .cav { width:120px; height:120px; border-radius:50%;
                       background:linear-gradient(135deg,#5865f2,#b14aff);
                       display:flex; align-items:center; justify-content:center;
                       font-size:48px; font-weight:800;
                       animation:pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
  #call-overlay .cname { font-size:24px; font-weight:700; }
  #call-overlay .cstat { color:var(--dim); font-size:14px; }
  #call-overlay .controls { display:flex; gap:20px; margin-top:30px; }
  #call-overlay .cbtn { width:64px; height:64px; border-radius:50%; border:none;
                        color:#fff; font-size:24px; cursor:pointer;
                        display:flex; align-items:center; justify-content:center; }
  #call-overlay .cbtn.accept { background:var(--green); }
  #call-overlay .cbtn.reject { background:var(--red); }
  #call-overlay .cbtn.mute { background:var(--bg4); }

  /* модалки */
  .modal { position:fixed; inset:0; z-index:600; background:rgba(0,0,0,.75);
           display:none; align-items:center; justify-content:center; padding:20px; }
  .modal.show { display:flex; }
  .modal-box { background:var(--bg2); border-radius:12px; padding:24px;
               max-width:420px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.6);
               max-height:80vh; overflow-y:auto; }
  .modal-box h2 { margin:0 0 16px; font-size:20px; color:#fff; }
  .modal-box h3 { margin:16px 0 8px; font-size:12px; color:var(--dim);
                  letter-spacing:1px; text-transform:uppercase; }
  .modal-box input { width:100%; padding:12px 14px; border-radius:8px;
                     background:var(--bg3); border:1px solid var(--line);
                     color:var(--text); font-size:15px; font-family:inherit;
                     outline:none; margin-bottom:10px; }
  .modal-box input:focus { border-color:var(--accent); }
  .modal-box button.prim { width:100%; padding:12px; border-radius:8px;
                           background:var(--accent); color:#fff; border:none;
                           font-size:15px; font-weight:600; cursor:pointer;
                           font-family:inherit; margin-top:6px; }
  .modal-box button.prim:hover { background:var(--accent2); }
  .modal-box .close { background:none; border:none; color:var(--dim);
                      float:right; font-size:22px; cursor:pointer; margin-top:-10px; }
  .search-item { display:flex; align-items:center; gap:12px; padding:10px;
                 border-radius:8px; cursor:pointer; }
  .search-item:hover { background:var(--bg3); }
  .search-item .av { width:36px; height:36px; border-radius:50%;
                     background:linear-gradient(135deg,#5865f2,#b14aff);
                     display:flex; align-items:center; justify-content:center;
                     color:#fff; font-weight:700; }
  .search-item .info { flex:1; }
  .search-item .u { font-weight:600; color:#fff; }
  .search-item .p { font-size:12px; color:var(--dim); }
  .search-item button { background:var(--accent); border:none; color:#fff;
                        padding:6px 12px; border-radius:6px; font-size:12px;
                        cursor:pointer; font-weight:600; }

  /* авторизация */
  #auth { position:fixed; inset:0; z-index:1000; display:flex;
          align-items:center; justify-content:center;
          background:linear-gradient(135deg,#5865f2,#b14aff); padding:20px; }
  #auth.hide { display:none; }
  .auth-card { background:var(--bg2); border-radius:16px; padding:32px 28px;
               width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .auth-card h1 { margin:0 0 6px; font-size:26px; color:#fff; text-align:center; }
  .auth-card p { margin:0 0 24px; color:var(--dim); text-align:center; font-size:13px; }
  .auth-tabs { display:flex; gap:4px; margin-bottom:20px; background:var(--bg3);
               padding:4px; border-radius:8px; }
  .auth-tabs button { flex:1; padding:10px; background:transparent; border:none;
                      color:var(--dim); font-size:14px; font-weight:600;
                      border-radius:6px; cursor:pointer; font-family:inherit; }
  .auth-tabs button.active { background:var(--accent); color:#fff; }
  .auth-card label { display:block; font-size:12px; color:var(--dim);
                     margin-bottom:6px; font-weight:600; }
  .auth-card input { width:100%; padding:12px 14px; border-radius:8px;
                     background:var(--bg3); border:1px solid var(--line);
                     color:var(--text); font-size:15px; outline:none;
                     font-family:inherit; margin-bottom:14px; }
  .auth-card input:focus { border-color:var(--accent); }
  .auth-err { color:var(--red); font-size:13px; text-align:center;
              min-height:18px; margin-bottom:8px; }
  .hint { font-size:11px; color:var(--dim); margin:-8px 0 12px; line-height:1.4; }
  .submit { width:100%; padding:12px; border-radius:8px; background:var(--accent);
            color:#fff; border:none; font-size:15px; font-weight:600;
            cursor:pointer; font-family:inherit; }
  .submit:hover { background:var(--accent2); }
  .submit:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>

<!-- ==================== АВТОРИЗАЦИЯ ==================== -->
<div id="auth">
  <div class="auth-card">
    <h1>NEXUS</h1>
    <p>Мессенджер нового поколения</p>

    <div class="auth-tabs">
      <button class="active" data-a="login">Вход</button>
      <button data-a="register">Регистрация</button>
    </div>

    <div id="login-fields">
      <label>Номер телефона или @username</label>
      <input type="text" id="a-login" placeholder="+7 999 123 45 67 или username" autocomplete="off" autocapitalize="off">
    </div>

    <div id="reg-fields" style="display:none">
      <label>Номер телефона <span style="color:#949ba4;font-weight:400">(необязательно)</span></label>
      <input type="tel" id="a-phone" placeholder="+7 999 123 45 67" autocomplete="off">

      <label>Юзернейм <span style="color:#949ba4;font-weight:400">(необязательно)</span></label>
      <input type="text" id="a-username" placeholder="username" autocomplete="off" autocapitalize="off">

      <div class="hint">Заполни хотя бы одно поле. Если юзернейм оставишь пустым — сгенерируется автоматически.</div>
    </div>

    <label>Пароль</label>
    <input type="password" id="a-pass" placeholder="••••••">

    <div class="auth-err" id="a-err"></div>
    <button class="submit" id="a-submit">Войти</button>
  </div>
</div>

<!-- ==================== ОСНОВНОЙ ИНТЕРФЕЙС ==================== -->
<div id="app">
  <div id="servers">
    <div class="server add" id="btn-add-friend" title="Добавить друга">+</div>
    <div class="server add" id="btn-create-group" title="Создать группу">👥</div>
  </div>

  <div id="channels">
    <div id="channels-header">
      <span>Личные сообщения</span>
      <button id="btn-search" title="Поиск">🔍</button>
    </div>
    <div id="channel-list"></div>
  </div>

  <div id="chat-panel">
    <div id="chat-header">
      <div>
        <div class="title" id="chat-title">Выбери чат</div>
        <div class="status" id="chat-status"></div>
      </div>
      <div class="actions">
        <button id="btn-call-audio" title="Аудиозвонок">📞</button>
        <button id="btn-call-video" title="Видеозвонок">🎥</button>
      </div>
    </div>
    <div id="messages"></div>
    <div id="input-row">
      <button class="icon file" id="btn-file" title="Файл">📎</button>
      <div id="input-wrap">
        <textarea id="input" rows="1" placeholder="Написать сообщение..."></textarea>
      </div>
      <button class="icon" id="btn-send">➤</button>
    </div>
  </div>
</div>

<!-- ==================== ЗВОНОК ==================== -->
<div id="call-overlay">
  <div class="cav" id="call-avatar">?</div>
  <div class="cname" id="call-name">—</div>
  <div class="cstat" id="call-status">Звонок...</div>
  <div class="controls" id="call-controls"></div>
</div>

<!-- ==================== МОДАЛКИ ==================== -->
<div class="modal" id="modal-search">
  <div class="modal-box">
    <button class="close" onclick="closeModal('modal-search')">×</button>
    <h2>Поиск людей</h2>
    <input type="text" id="search-input" placeholder="username или номер телефона">
    <div id="search-results"></div>
  </div>
</div>

<div class="modal" id="modal-group">
  <div class="modal-box">
    <button class="close" onclick="closeModal('modal-group')">×</button>
    <h2>Новая группа</h2>
    <input type="text" id="group-name" placeholder="Название группы">
    <h3>Выбери участников</h3>
    <div id="group-members"></div>
    <button class="prim" id="group-create">Создать</button>
  </div>
</div>

<input type="file" id="file-input" style="display:none">

<script>
const $ = id => document.getElementById(id);
let base = '';
let me = null;
let ws = null;
let currentChat = null;
let allFriends = [];
let allGroups = [];
let pc = null;
let localStream = null;
let currentCall = null;

/* ==================== API ==================== */
async function api(path, opts = {}) {
  const r = await fetch(base + path, {
    ...opts,
    headers: {'Content-Type': 'application/json', ...(opts.headers || {})},
  });
  return r.json();
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ==================== АВТОРИЗАЦИЯ ==================== */
let authMode = 'login';

document.querySelectorAll('.auth-tabs button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.auth-tabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    authMode = b.dataset.a;
    if (authMode === 'register') {
      $('login-fields').style.display = 'none';
      $('reg-fields').style.display = 'block';
      $('a-submit').textContent = 'Создать аккаунт';
    } else {
      $('login-fields').style.display = 'block';
      $('reg-fields').style.display = 'none';
      $('a-submit').textContent = 'Войти';
    }
    $('a-err').textContent = '';
  };
});

$('a-submit').onclick = async () => {
  const pass = $('a-pass').value;
  $('a-err').textContent = '';
  $('a-submit').disabled = true;

  try {
    let res;
    if (authMode === 'register') {
      const phone = ($('a-phone').value || '').trim();
      const username = ($('a-username').value || '').trim();
      if (!phone && !username) throw new Error('Укажи номер телефона или юзернейм');
      if (pass.length < 4) throw new Error('Пароль минимум 4 символа');
      res = await api('/auth/register', {
        method: 'POST',
        body: JSON.stringify({phone, password: pass, username}),
      });
    } else {
      const login = ($('a-login').value || '').trim();
      if (!login) throw new Error('Введи номер или юзернейм');
      if (!pass) throw new Error('Введи пароль');
      res = await api('/auth/login', {
        method: 'POST',
        body: JSON.stringify({login, password: pass}),
      });
    }
    if (res.error) throw new Error(res.error);

    localStorage.setItem('uid', res.id);
    localStorage.setItem('uname', res.username);
    localStorage.setItem('uphone', res.phone || '');
    me = {id: res.id, username: res.username, phone: res.phone || ''};

    $('auth').classList.add('hide');
    $('app').classList.add('on');
    init();
  } catch (e) {
    $('a-err').textContent = e.message || 'Ошибка';
  } finally {
    $('a-submit').disabled = false;
  }
};

/* ==================== INIT ==================== */
async function init() {
  await loadFriends();
  await loadGroups();
  connectWS();
}

async function loadFriends() {
  allFriends = await api(`/friends/${me.id}`);
  renderChatList();
}

async function loadGroups() {
  allGroups = await api(`/groups/${me.id}`);
  renderChatList();
}

function renderChatList() {
  const el = $('channel-list');
  el.innerHTML = '';

  if (allGroups.length) {
    const h = document.createElement('div');
    h.className = 'section-h'; h.textContent = 'ГРУППЫ';
    el.appendChild(h);
    for (const g of allGroups) {
      const d = document.createElement('div');
      const active = currentChat?.type === 'group' && currentChat.id === g.id;
      d.className = 'chan' + (active ? ' active' : '');
      d.innerHTML = `
        <div class="av">${esc((g.name[0] || 'Г').toUpperCase())}</div>
        <div style="flex:1;min-width:0">
          <div class="nm">${esc(g.name)}</div>
          <div class="sub">${g.count} участников</div>
        </div>`;
      d.onclick = () => openChat({type:'group', id:g.id, name:g.name});
      el.appendChild(d);
    }
  }

  if (allFriends.length) {
    const h = document.createElement('div');
    h.className = 'section-h'; h.textContent = 'ДРУЗЬЯ';
    el.appendChild(h);
    for (const f of allFriends) {
      const d = document.createElement('div');
      const active = currentChat?.type === 'user' && currentChat.id === f.id;
      d.className = 'chan' + (active ? ' active' : '');
      d.innerHTML = `
        <div class="av ${f.online ? 'online' : ''}">${esc((f.username[0]||'?').toUpperCase())}</div>
        <div style="flex:1;min-width:0">
          <div class="nm">${esc(f.username)}</div>
          <div class="sub">${f.online ? 'в сети' : 'не в сети'}</div>
        </div>`;
      d.onclick = () => openChat({type:'user', id:f.id, name:f.username, online:f.online});
      el.appendChild(d);
    }
  }

  if (!allGroups.length && !allFriends.length) {
    el.innerHTML = '<div style="padding:30px 16px;color:#949ba4;font-size:13px;text-align:center">' +
      'Пока пусто.<br><br>Нажми <b>+</b> слева, чтобы найти людей.</div>';
  }
}

async function openChat(chat) {
  currentChat = chat;
  renderChatList();
  $('chat-title').textContent = chat.name;
  $('chat-status').textContent = chat.type === 'user' ? (chat.online ? 'в сети' : 'не в сети') : 'группа';
  $('chat-status').className = 'status' + (chat.online ? ' online' : '');

  const q = chat.type === 'group' ? `gid=${chat.id}` : `peer=${chat.id}`;
  const msgs = await api(`/messages/${me.id}?${q}`);
  const el = $('messages');
  el.innerHTML = '';
  for (const m of msgs) addMessage(m);
}

function addMessage(m) {
  const el = $('messages');
  const own = m.from === me.id;
  const senderName = own ? me.username :
    (allFriends.find(f => f.id === m.from)?.username ||
     allGroups.find(g => g.id === m.gid)?.name || '??');
  const d = document.createElement('div');
  d.className = 'msg' + (own ? ' own' : '');
  const time = new Date(m.ts * 1000).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  let body = `<div class="txt">${esc(m.text)}</div>`;
  if (m.file) {
    body += `<a class="file" href="${m.file.url}" target="_blank">📎 ${esc(m.file.name)}</a>`;
  }
  d.innerHTML = `
    <div class="av">${esc((senderName[0]||'?').toUpperCase())}</div>
    <div class="body">
      <div class="head">
        <span class="name">${esc(senderName)}</span>
        <span class="time">${time}</span>
      </div>
      ${body}
    </div>`;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

/* ==================== ОТПРАВКА ==================== */
function sendMessage(text = '', file = null) {
  if (!currentChat || !ws || ws.readyState !== 1) return;
  const payload = {type: 'msg', text, file, msg_type: file ? 'file' : 'text'};
  if (currentChat.type === 'user') payload.to = currentChat.id;
  else payload.gid = currentChat.id;
  ws.send(JSON.stringify(payload));
}

$('btn-send').onclick = () => {
  const v = $('input').value.trim();
  if (!v) return;
  sendMessage(v);
  $('input').value = '';
  $('input').style.height = 'auto';
};
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('btn-send').click(); }
});
$('input').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 180) + 'px';
});

/* ==================== ФАЙЛЫ ==================== */
$('btn-file').onclick = () => $('file-input').click();
$('file-input').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const form = new FormData();
  form.append('file', f);
  const r = await fetch(base + '/upload', {method: 'POST', body: form});
  const j = await r.json();
  sendMessage('', {name: j.name, url: j.url, size: j.size});
  e.target.value = '';
};

/* ==================== WEBSOCKET ==================== */
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const host = location.host || localStorage.getItem('srv') || 'localhost:8000';
  ws = new WebSocket(`${proto}://${host}/ws/chat/${me.id}`);
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.type === 'msg' && currentChat) {
      const m = d.msg;
      if (currentChat.type === 'user' && (m.from === currentChat.id || m.to === currentChat.id)) {
        addMessage(m);
      } else if (currentChat.type === 'group' && m.gid === currentChat.id) {
        addMessage(m);
      }
    } else if (d.type === 'friend_added') {
      loadFriends();
    } else if (d.type === 'group_added' || d.type === 'group_created') {
      loadGroups();
    } else if (d.type === 'presence') {
      const f = allFriends.find(x => x.id === d.uid);
      if (f) { f.online = d.online; renderChatList(); }
    } else if (d.type.startsWith('call_')) {
      handleCallSignal(d);
    }
  };
  ws.onclose = () => setTimeout(connectWS, 2000);
}

/* ==================== ПОИСК ==================== */
$('btn-search').onclick = () => {
  $('search-input').value = '';
  $('search-results').innerHTML = '';
  openModal('modal-search');
  setTimeout(() => $('search-input').focus(), 100);
};
$('btn-add-friend').onclick = () => $('btn-search').click();

$('search-input').oninput = async (e) => {
  const q = e.target.value.trim();
  const el = $('search-results');
  if (!q) { el.innerHTML = ''; return; }
  const res = await api(`/search?q=${encodeURIComponent(q)}`);
  el.innerHTML = '';
  for (const u of res) {
    if (u.id === me.id) continue;
    const d = document.createElement('div');
    d.className = 'search-item';
    const isFriend = allFriends.some(f => f.id === u.id);
    d.innerHTML = `
      <div class="av">${esc((u.username[0]||'?').toUpperCase())}</div>
      <div class="info">
        <div class="u">@${esc(u.username)}</div>
        <div class="p">${esc(u.phone || '—')} · ${u.online ? 'в сети' : 'не в сети'}</div>
      </div>
      <button>${isFriend ? 'Написать' : 'Добавить'}</button>`;
    d.querySelector('button').onclick = async () => {
      if (isFriend) {
        closeModal('modal-search');
        openChat({type:'user', id:u.id, name:u.username, online:u.online});
      } else {
        await api(`/friends/${me.id}/add`, {method:'POST', body: JSON.stringify({target: u.id})});
        await loadFriends();
        closeModal('modal-search');
        openChat({type:'user', id:u.id, name:u.username, online:u.online});
      }
    };
    el.appendChild(d);
  }
};

/* ==================== ГРУППЫ ==================== */
$('btn-create-group').onclick = () => {
  $('group-name').value = '';
  const el = $('group-members');
  el.innerHTML = '';
  if (!allFriends.length) {
    el.innerHTML = '<div style="color:#949ba4;font-size:13px;padding:10px">Сначала добавь друзей</div>';
  }
  for (const f of allFriends) {
    const d = document.createElement('div');
    d.className = 'search-item';
    d.innerHTML = `
      <input type="checkbox" data-uid="${f.id}">
      <div class="av">${esc((f.username[0]||'?').toUpperCase())}</div>
      <div class="info"><div class="u">${esc(f.username)}</div></div>`;
    el.appendChild(d);
  }
  openModal('modal-group');
};
$('group-create').onclick = async () => {
  const name = $('group-name').value.trim();
  if (!name) return alert('Введи название');
  const members = Array.from(document.querySelectorAll('#group-members input:checked'))
    .map(i => i.dataset.uid);
  const res = await api('/groups/create', {
    method: 'POST',
    body: JSON.stringify({owner: me.id, name, members}),
  });
  await loadGroups();
  closeModal('modal-group');
  openChat({type:'group', id:res.gid, name:res.name});
};

/* ==================== МОДАЛКИ ==================== */
function openModal(id) { $(id).classList.add('show'); }
function closeModal(id) { $(id).classList.remove('show'); }

/* ==================== ЗВОНКИ ==================== */
async function startCall(video = false) {
  if (!currentChat || currentChat.type !== 'user') {
    alert('Звонки только в личных чатах');
    return;
  }
  try {
    localStream = await navigator.mediaDevices.getUserMedia({audio:true, video});
    pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    pc.onicecandidate = (e) => {
      if (e.candidate) ws.send(JSON.stringify({type:'call_ice', to:currentChat.id, candidate:e.candidate}));
    };
    pc.ontrack = (e) => {
      const a = new Audio();
      a.srcObject = e.streams[0];
      a.play();
    };
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    ws.send(JSON.stringify({
      type:'call_offer', to:currentChat.id,
      sdp: pc.localDescription, call_type: video ? 'video' : 'audio',
    }));
    showCallUI(currentChat.name, 'Исходящий...', false);
  } catch (e) {
    alert('Нет доступа к микрофону/камере: ' + e.message);
  }
}
$('btn-call-audio').onclick = () => startCall(false);
$('btn-call-video').onclick = () => startCall(true);

async function handleCallSignal(d) {
  if (d.type === 'call_offer') {
    currentCall = {id:d.call_id, from:d.from, sdp:d.sdp, type:d.call_type};
    showCallUI('Входящий звонок', 'Принять?', true);
  } else if (d.type === 'call_answer') {
    if (pc) { await pc.setRemoteDescription(d.sdp); $('call-status').textContent = 'Разговор'; }
  } else if (d.type === 'call_ice') {
    try { if (pc) await pc.addIceCandidate(d.candidate); } catch (e) {}
  } else if (d.type === 'call_end' || d.type === 'call_reject') {
    endCall();
  }
}

function showCallUI(name, status, incoming = false) {
  $('call-name').textContent = name;
  $('call-status').textContent = status;
  $('call-avatar').textContent = (name[0] || '?').toUpperCase();
  const ctr = $('call-controls');
  if (incoming) {
    ctr.innerHTML = '<button class="cbtn accept" id="call-accept">✓</button>' +
                    '<button class="cbtn reject" id="call-reject">✕</button>';
  } else {
    ctr.innerHTML = '<button class="cbtn mute" id="call-mute">🎤</button>' +
                    '<button class="cbtn reject" id="call-reject">✕</button>';
  }
  $('call-overlay').classList.add('show');

  if (incoming) {
    $('call-accept').onclick = async () => {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true, video: currentCall.type === 'video'
        });
        pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        pc.onicecandidate = (e) => {
          if (e.candidate) ws.send(JSON.stringify({type:'call_ice', to:currentCall.from, candidate:e.candidate}));
        };
        pc.ontrack = (e) => {
          const a = new Audio();
          a.srcObject = e.streams[0];
          a.play();
        };
        await pc.setRemoteDescription(currentCall.sdp);
        const ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        ws.send(JSON.stringify({type:'call_answer', to:currentCall.from, sdp:pc.localDescription}));
        $('call-status').textContent = 'Разговор';
      } catch (e) { alert(e.message); endCall(); }
    };
  }
  $('call-reject').onclick = () => {
    const target = currentChat?.id || currentCall?.from;
    if (target) ws.send(JSON.stringify({type:'call_reject', to: target}));
    endCall();
  };
  const mute = $('call-mute');
  if (mute) mute.onclick = () => {
    if (localStream) {
      const t = localStream.getAudioTracks()[0];
      t.enabled = !t.enabled;
      mute.textContent = t.enabled ? '🎤' : '🔇';
    }
  };
}

function endCall() {
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  currentCall = null;
  $('call-overlay').classList.remove('show');
}

/* ==================== СТАРТ ==================== */
(async () => {
  if (location.protocol === 'file:') {
    const ip = prompt('Адрес сервера:', localStorage.getItem('srv') || 'localhost:8000');
    if (ip) { localStorage.setItem('srv', ip); base = `http://${ip}`; }
  }
  const uid = localStorage.getItem('uid');
  const uname = localStorage.getItem('uname');
  const uphone = localStorage.getItem('uphone');
  if (uid && uname) {
    me = {id: uid, username: uname, phone: uphone || ''};
    $('auth').classList.add('hide');
    $('app').classList.add('on');
    init();
  }
})();
</script>
